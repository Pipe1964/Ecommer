<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Recuperar Contraseña</title>
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-50 to-purple-50">

  <!-- HEADER -->
  <header class="w-full flex items-center justify-between px-10 py-6">
    <!-- Logo -->
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600 p-2 rounded-lg flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke-width="1.5" stroke="white" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M13.5 21v-7.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349m-16.5 11.65V9.35m0 0a3.001 3.001 0 003.75-.615A2.993 2.993 0 009.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 002.25 1.016c.896 0 1.7-.393 2.25-1.016a3.001 3.001 0 003.75.614m-16.5 0a3.004 3.004 0 01-.621-4.72L4.318 3.44A1.5 1.5 0 015.378 3h13.243a1.5 1.5 0 011.06.44l1.19 1.189a3 3 0 01-.621 4.72m-13.5 8.65h3.75a.75.75 0 00.75-.75V13.5a.75.75 0 00-.75-.75H6.75a.75.75 0 00-.75.75v3.75c0 .415.336.75.75.75z" />
        </svg>
      </div>
      <h1 class="text-2xl font-semibold text-indigo-600">TechStore Pro</h1>
    </div>

    <!-- Volver al login -->
    <a href="./login.html" class="text-blue-600 font-medium hover:underline transition">
      Volver al Login
    </a>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="flex justify-center items-center mt-10">
    <div class="bg-white shadow-2xl rounded-2xl px-12 py-12 w-full max-w-md text-center">

      <!-- ICONO -->
      <div class="w-20 h-20 mx-auto rounded-full flex items-center justify-center
                  bg-gradient-to-r from-blue-500 to-purple-600 mb-6 text-white shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
             viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
             class="w-10 h-10">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
        </svg>
      </div>

      <!-- TÍTULO -->
      <h2 class="text-3xl font-bold text-gray-800 mb-2">Recuperar Contraseña</h2>
      <p class="text-gray-600 text-sm mb-8">
        Ingresa tu correo para recibir un código de verificación
      </p>

      <!-- FORMULARIO -->
      <form id="form-recuperar">
        <label class="block text-left text-gray-700 font-semibold mb-2">
          Correo Electrónico
        </label>

        <input 
          id="email-recuperar"
          type="email" 
          placeholder="tu@email.com"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg
                 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent
                 mb-6 transition"
          required
        >

        <button 
          id="btn-enviar"
          type="submit"
          class="w-full py-3 rounded-lg text-white font-semibold
                 bg-gradient-to-r from-blue-500 to-purple-600
                 hover:from-blue-600 hover:to-purple-700
                 transition-all duration-200 shadow-lg hover:shadow-xl
                 transform hover:scale-105">
          Enviar Código
        </button>
      </form>
    </div>
  </div>

  <!-- DESPUÉS -->
<script src="java/recuperar.js"></script>
</body>
</html>
