<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Perfil</title>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center py-10">

  <div class="bg-white shadow-xl rounded-2xl p-10 w-full max-w-3xl">

    <!-- Encabezado -->
    <div class="flex items-center gap-4 mb-8">
      <div id="avatar-perfil"
        class="w-20 h-20 rounded-full bg-gradient-to-r from-blue-600 to-purple-500 
               flex items-center justify-center text-white text-3xl font-bold">
        US
      </div>

      <div>
        <h2 id="nombre-completo" class="text-2xl font-bold">Cargando...</h2>
        <p id="email-header" class="text-gray-500">Cargando...</p>
      </div>
    </div>

    <hr class="mb-8" />

    <!-- Formulario -->
    <form id="form-editar-perfil">
      <div class="grid grid-cols-1 gap-6">

        <!-- Usuario (solo lectura) -->
        <div>
          <label class="text-gray-700 font-semibold block mb-2">Usuario</label>
          <input 
            id="usuario"
            type="text"
            placeholder="Usuario"
            class="w-full p-3 bg-gray-200 border rounded-lg outline-none cursor-not-allowed"
            readonly
          >
        </div>

        <!-- Correo (solo lectura) -->
        <div>
          <label class="text-gray-700 font-semibold block mb-2">Correo Electrónico</label>
          <input 
            id="email"
            type="email"
            placeholder="Email"
            class="w-full p-3 bg-gray-200 border rounded-lg outline-none cursor-not-allowed"
            readonly
          >
        </div>

        <!-- Teléfono (editable) -->
        <div>
          <label class="text-gray-700 font-semibold block mb-2">Teléfono</label>
          <input 
            id="telefono"
            type="number"
            placeholder="Teléfono"
            class="w-full p-3 bg-gray-100 border border-gray-300 rounded-lg outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            disabled
          >
        </div>
      </div>

      <!-- Botón Editar Perfil (modo inicial) -->
      <button
        id="btn-editar"
        type="button"
        class="w-full mt-8 py-3 text-white font-semibold rounded-xl 
               bg-gradient-to-r from-blue-600 to-purple-600 hover:opacity-90 
               transition-all duration-200 shadow-lg hover:shadow-xl">
        Editar Perfil
      </button>

      <!-- Botones Guardar/Cancelar (ocultos inicialmente) -->
      <div id="botones-accion" class="hidden grid grid-cols-2 gap-4 mt-8">
        <button
          type="submit"
          class="py-3 text-white font-semibold rounded-xl 
                 bg-green-600 hover:bg-green-700 
                 transition-all duration-200 shadow-lg hover:shadow-xl">
          Guardar Cambios
        </button>
        
        <button
          id="btn-cancelar"
          type="button"
          class="py-3 text-white font-semibold rounded-xl 
                 bg-gray-600 hover:bg-gray-700 
                 transition-all duration-200 shadow-lg hover:shadow-xl">
          Cancelar
        </button>
      </div>
    </form>

  </div>

  <!-- Toast de éxito -->
  <div id="toast-exito" 
       class="hidden fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg transition-opacity duration-300 opacity-0">
    ✓ Perfil actualizado exitosamente
  </div>

  <!-- ENLAZAR EL JAVASCRIPT -->
  <script src="/src/pages/java/perfil.js"></script>

</body>
</html>
